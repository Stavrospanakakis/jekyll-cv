<div class="header">
    <div class="title">
      <a href="index.html">
        {{site.data.data.name}}
      </a>
    </div>
    <div class="subtitle">
      {{site.data.data.description}}
    </div>
    {% if site.data.data.support_dark_mode%}
      <input type="checkbox" id="switch" name="mode" class="toggle-dark"></input>
      <label for="switch">
        <i id="moon" data-feather="moon" fill="var(--fg-color)"></i>
      </label>
    {%endif%}
  </div>
